[install]
# React and the other shared libraries come from the root install (scripts/link-root-packages.ts).
peer = false

# Bun reads this file only when `bun test` starts in this directory (`bun run test` does).
# Upstream's own preloads: a DOM before any module that reads one is evaluated (the key engine
# reads `navigator` at load), then its matchers, its resets, and its checks, which fail a test
# that updates React outside `act` or sends a request nothing answers.
[test]
preload = ["../dispatch/web/src/__tests__/register-dom.ts", "../dispatch/web/src/__tests__/setup.ts"]
randomize = true
