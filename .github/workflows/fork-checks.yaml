name: Fork checks

# This repository is a fork, and this file, which upstream does not have, checks what the fork
# adds: its whole diff against upstream's main stays on .github/fork-allowlist.txt, its own web
# app, packages/tl-dispatch, type-checks, lints and passes its tests (the layers, the design rules,
# the route map, the view map and the copied upstream code among them), and its UI package,
# packages/ui, type-checks, lints, passes its tests and keeps a valid registry.json. Upstream's
# own jobs in ci.yaml run beside it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allowlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # The parent is read from the API, so no file of this fork names it.
      - name: Fetch upstream's main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          upstream=$(gh api "repos/$REPOSITORY" --jq '.parent.full_name // empty')
          if [ -z "$upstream" ]; then
            echo "::error::this repository has no parent to compare with"
            exit 1
          fi
          git fetch --no-tags --filter=blob:none "https://github.com/$upstream.git" main

      - name: Test the allowlist script
        run: .github/scripts/check-fork-allowlist.test.sh

      - name: Check the fork's diff against the allowlist
        run: .github/scripts/check-fork-allowlist.sh FETCH_HEAD

  tl-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/tl-dispatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # The root install first: the app links React and the other shared libraries from it. Then
      # the UI package's, whose sources the app imports.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
        working-directory: packages/ui
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test (layers, design rules, route map, view map, copied upstream code)
        run: bun run test

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # The root install first: the package links React and the test tools from it.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test (components, theme, registry.json drift and validity)
        run: bun run test
