name: Fork sync test

# This repository is a fork, and this file, which upstream does not have, tests the daily sync's
# script (.github/scripts/fork-sync.sh) with .github/scripts/fork-sync.test.sh: scratch copies of
# this repository and of upstream on the runner, and a stub gh. It runs on a pull request that
# changes the script, its test or either workflow, and when someone starts it.
on:
  pull_request:
    paths:
      - .github/scripts/fork-sync.sh
      - .github/scripts/fork-sync.test.sh
      - .github/scripts/test-lib.sh
      - .github/workflows/fork-sync.yaml
      - .github/workflows/fork-sync-test.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Test the sync script
        shell: bash
        run: .github/scripts/fork-sync.test.sh
